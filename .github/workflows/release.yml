name: Release

# Scaffolded, not yet exercised — see claudedocs/cycle-logs/cycle-05.md. Publishing to npm needs
# a one-time human step first: configure this repo + this workflow file as a "Trusted Publisher"
# for @iyulab/git-fresh in the package's npm settings (https://docs.npmjs.com/trusted-publishers/).
# Trusted publishing needs no npm token/secret at all — `id-token: write` below is what lets the
# npm CLI authenticate via GitHub's OIDC token instead.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Create a "Version Packages" PR, or publish once one is merged
        uses: changesets/action@v2
        with:
          publish-script: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
