name: Release

# Version-bump PR / publish automation via changesets. Authenticates to npm with the org-level
# `NPM_TOKEN` secret (mapped to NODE_AUTH_TOKEN, the env var actions/setup-node's generated
# .npmrc reads); `id-token: write` is kept alongside it so npm can still attach a provenance
# attestation (NPM_CONFIG_PROVENANCE below) even though auth itself is token-based, not OIDC
# trusted publishing.
#
# The very first release (0.1.0) needs a changeset to exist before this workflow has anything to
# version/publish — if none exists yet, either publish 0.1.0 by hand once (see the project's
# publish notes) or run `npx changeset add` before merging to main.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Create a "Version Packages" PR, or publish once one is merged
        uses: changesets/action@v2
        with:
          publish-script: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
